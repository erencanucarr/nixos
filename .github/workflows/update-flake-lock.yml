name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v32

      - name: Update flake.lock
        id: update
        run: |
          nix flake update 2> update.log
          cat update.log
          {
            echo 'log<<EOF'
            grep -vE '^(unpacking|warning)' update.log || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          rm update.log

      - name: Evaluate the system
        run: nix eval --raw .#nixosConfigurations.b850e-desktop.config.system.build.toplevel.drvPath

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-flake-lock
          delete-branch: true
          add-paths: flake.lock
          commit-message: Update flake.lock
          title: Update flake.lock
          body: |
            Weekly update of the flake inputs. The system still evaluates.

            ```
            ${{ steps.update.outputs.log }}
            ```

            Review the changes, then `nixos-rebuild switch` after merging.
