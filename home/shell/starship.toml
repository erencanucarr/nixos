add_newline = true
format = """
[](fg:text)$os$username[](bg:rule fg:text)$directory[](fg:rule bg:raised)$git_branch$git_status[](fg:raised bg:line)$nix_shell$cmd_duration[](fg:line)$fill$time
$character"""

[os]
disabled = false
style = "bg:text fg:ground"
format = "[$symbol]($style)"
symbols.NixOS = " "

[username]
show_always = true
style_user = "bg:text fg:ground bold"
format = "[$user ]($style)"

[directory]
style = "bg:rule fg:bright bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "  ~"

[git_branch]
symbol = ""
style = "bg:raised fg:dim"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:raised fg:text bold"
format = "[$all_status$ahead_behind ]($style)"

[nix_shell]
symbol = ""
style = "bg:line fg:dim"
format = "[ $symbol $name ]($style)"

[cmd_duration]
min_time = 2000
style = "bg:line fg:warm"
format = "[ 󱦟 $duration ]($style)"

[fill]
symbol = " "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:dim"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](bold bright)"
error_symbol = "[❯](bold hot)"
