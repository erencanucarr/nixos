source = /home/can/.config/can-theme/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgb($ground)
    blur_passes = 3
    blur_size = 8
    brightness = 0.4
}

label {
    monitor =
    text = $TIME
    color = rgb($bright)
    font_family = Inter
    font_size = 80
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=tr_TR.UTF-8 date +"%A, %-d %B"
    color = rgb($dim)
    font_family = Inter
    font_size = 15
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 42
    outline_thickness = 1
    rounding = 8
    outer_color = rgba(ffffff14)
    inner_color = rgb($raised)
    font_color = rgb($text)
    font_family = Inter
    check_color = rgb($warm)
    fail_color = rgb($hot)
    fail_text = Yanlış şifre
    placeholder_text = <span foreground="##$dim">Şifre</span>
    dots_size = 0.2
    dots_spacing = 0.35
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
