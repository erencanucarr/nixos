general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgb(0a0a0c)
    blur_passes = 3
    blur_size = 8
    brightness = 0.4
}

label {
    monitor =
    text = $TIME
    color = rgb(f7f8f8)
    font_family = Inter
    font_size = 80
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=tr_TR.UTF-8 date +"%A, %-d %B"
    color = rgb(8a8f98)
    font_family = Inter
    font_size = 15
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 42
    outline_thickness = 1
    rounding = 8
    outer_color = rgba(ffffff14)
    inner_color = rgb(151618)
    font_color = rgb(e6e7ea)
    font_family = Inter
    check_color = rgb(e5ae52)
    fail_color = rgb(e2715a)
    fail_text = Yanlış şifre
    placeholder_text = <span foreground="##8a8f98">Şifre</span>
    dots_size = 0.2
    dots_spacing = 0.35
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
