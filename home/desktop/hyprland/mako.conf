# Bildirimler (mako), ~/.config/mako/config olarak bağlı. Graphite renkleri.
font=Inter 10
width=340
margin=10
padding=12,14
border-size=1
border-radius=8
background-color=#151618
text-color=#e6e7ea
border-color=#1d1d1f
progress-color=over #232427
icons=1
max-icon-size=40
default-timeout=5000
anchor=top-right
layer=overlay

[urgency=low]
text-color=#8a8f98

[urgency=critical]
border-color=#e2715a
default-timeout=0
