[meta]
version = 1
name = "Graphite"
description = "Graphite"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "#0a0a0c"
foreground = "#e6e7ea"
secondary_background = "#151618"
border = "#1d1d1f"
accent = "#e6e7ea"
accent_foreground = "#0a0a0c"

[colors.accents]
blue = "#8fb0d9"
green = "#b5c98f"
magenta = "#cba6c9"
orange = "#e5ae52"
purple = "#ddc0db"
red = "#e2715a"
yellow = "#e5ae52"
cyan = "#88c0c8"

[colors.main_window]
border = "colors.core.border"
footer = { background = "colors.core.secondary_background" }

[colors.shortcut]
border = "colors.core.border"

[colors.text]
default = "colors.core.foreground"
muted = "#8a8f98"
placeholder = "#8a8f98"
danger = "#e2715a"
success = "#b5c98f"
selection = { background = "#e6e7ea", foreground = "#0a0a0c" }

[colors.input]
border = "colors.core.border"
border_focus = "#e5ae52"
border_error = "#e2715a"

[colors.button.primary]
background = "colors.core.secondary_background"
foreground = "colors.core.foreground"
hover = { background = "#212224" }
focus = { outline = "#e5ae52" }

[colors.list.item.hover]
background = "#161618"
foreground = "#e6e7ea"
secondary_foreground = "#8a8f98"

[colors.list.item.selection]
background = "#1b1b1d"
foreground = "#f7f8f8"
secondary_background = "#1b1b1d"
secondary_foreground = "#8a8f98"

[colors.grid.item]
background = "colors.core.secondary_background"
hover = { outline = "#1d1d1f" }
selection = { outline = "#8a8f98" }

[colors.scrollbars]
background = "#232427"

[colors.loading]
bar = "#8a8f98"
spinner = "#e6e7ea"
